<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130">
<!--
  As tres ondas sozinhas — o vapor, que é o m de "damira".

  PORQUE EXISTE À PARTE DO SÍMBOLO COMPLETO. Porque o pão só se lê a partir de
  certo tamanho. Num favicon de 16 px, o oval do pão e os dois cortes lá dentro
  colapsam numa mancha; as três ondas, que são traços verticais separados,
  aguentam. A regra é a do cliente: o M para o que é pequeno, o pão para o que é
  grande.

  É o mesmo desenho de simbolo.svg, recortado ao vapor e reenquadrado.
  Ver esse ficheiro para a origem e as ressalvas.
-->
